name: Deploy Current Main Website Preview

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

env:
  SOURCE_REPO: cloverwoodstudio/CLOVERWOOD-STUDIO
  SOURCE_SHA: 0ee5ec51cc4c8da7aa16288a75308bdf6c067666
  SOURCE_TREE: aa138f8952067cbfc53c0c42c1c700b026ec76b3
  BUNDLE_SHA256: 500d9f97fff00107c02626563c108297047f3701c936c14ade26a3ba8df1fbab
  BUNDLE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-0f74-81f4-b4b2-bdc577a18279/raw?se=2026-08-22T18%3A49%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=3b07ab66-89dc-5fc3-87e4-6d445a357007&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T05%3A30%3A56Z&ske=2026-08-23T05%3A30%3A56Z&sks=b&skv=2026-02-06&sig=Tf%2BY5AJkCmKJ7IALR6h7QGbQE1vJ/vioAXs8vCJsJn0%3D'
  PREVIEW_URL: https://cloverwoodstudio.github.io/CLOVERWOOD-STUDIO-PREVIEW/

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[preview-sync]')
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact validated static bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUNDLE_URL" -o bundle.zip
          echo "$BUNDLE_SHA256  bundle.zip" | sha256sum -c -
          rm -rf deployment-site
          mkdir deployment-site
          unzip -q bundle.zip -d deployment-site
          touch deployment-site/.nojekyll

      - name: Repair preview-only path adaptation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('deployment-site')
          old = '/CLOVERWOOD-STUDIO-PREVIEW/CLOVERWOOD-STUDIO-PREVIEW/'
          new = '/CLOVERWOOD-STUDIO-PREVIEW/'
          changed = []
          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.html', '.css', '.xml'}:
                  text = path.read_text(encoding='utf-8')
                  if old in text:
                      path.write_text(text.replace(old, new), encoding='utf-8')
                      changed.append(path.relative_to(root).as_posix())
          if changed not in ([], ['index.html']):
              raise SystemExit(f'Unexpected preview path repair scope: {changed}')
          print(f'preview path repair: {changed or "none"}')
          PY

      - name: Validate exact current preview content
        shell: bash
        run: |
          set -euo pipefail
          root=deployment-site
          for path in \
            index.html 404.html robots.txt sitemap.xml \
            cloverwood/index.html nuku/index.html studio-os/index.html \
            bridge-os/index.html o-studiu/index.html kontakt/index.html \
            brand/cloverwood-world-family-symbol.svg \
            brand/nuku-world-family-symbol.svg \
            brand/studio-os-family-symbol.svg \
            brand/bridge-os-family-symbol.svg; do
            test -f "$root/$path"
          done

          grep -Fq 'noindex, nofollow' "$root/index.html"
          grep -Fq 'Disallow: /' "$root/robots.txt"
          grep -Fq 'My svet' "$root/index.html"
          grep -Fq 'My ho objavujeme.' "$root/index.html"
          grep -Fq '>NUKU<' "$root/index.html"
          grep -Fq 'Autorský svet s vlastným kánonom, postavami a pravidlami kontinuity.' "$root/index.html"
          grep -Fq 'Objaviť NUKU' "$root/index.html"
          grep -Fq 'Spoznať Studio OS' "$root/index.html"
          grep -Fq 'Spoznať Bridge OS' "$root/index.html"
          grep -Fq 'mailto:cloverwoodstudio@gmail.com' "$root/kontakt/index.html"

          grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/cloverwood-world-family-symbol.svg' "$root/index.html"
          grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/nuku-world-family-symbol.svg' "$root/index.html"
          grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/studio-os-family-symbol.svg' "$root/index.html"
          grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/bridge-os-family-symbol.svg' "$root/index.html"

          if grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/icon-svet-outline-24.svg' "$root/index.html" || \
             grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/nuku-symbol-master-v1.1.svg' "$root/index.html" || \
             grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/icon-studio-outline-24.svg' "$root/index.html" || \
             grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/bridge-os-symbol-master-v1.0.svg' "$root/index.html"; then
            echo 'Old C/N/S/B card icon reference found.'
            exit 1
          fi

          if grep -R -I -F 'Svet príbehov, postáv a miest zakorenený v jednej živej logike.' "$root"; then
            echo 'Old Cloverwood copy found.'
            exit 1
          fi
          if grep -R -I -F 'Zistiť viac' "$root"; then
            echo 'Old CTA copy found.'
            exit 1
          fi
          if grep -R -I -i -F 'Company OS' "$root"; then
            echo 'Company OS public copy found.'
            exit 1
          fi
          if grep -R -I -i -F 'hreflang' "$root"; then
            echo 'hreflang unexpectedly present.'
            exit 1
          fi
          if grep -R -I -F '/CLOVERWOOD-STUDIO-PREVIEW/CLOVERWOOD-STUDIO-PREVIEW/' "$root"; then
            echo 'Duplicated preview base path found.'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: deployment-site

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview only
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for current preview to become live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --location "$PREVIEW_URL" -o live-index.html && \
               grep -Fq 'Autorský svet s vlastným kánonom, postavami a pravidlami kontinuity.' live-index.html && \
               grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/cloverwood-world-family-symbol.svg' live-index.html && \
               grep -Fq '>NUKU<' live-index.html; then
              exit 0
            fi
            sleep 5
          done
          echo 'Current preview did not become live in time.'
          exit 1

      - name: Verify live symbols, copy and contact
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'noindex, nofollow' live-index.html
          grep -Fq 'Objaviť NUKU' live-index.html
          grep -Fq 'Spoznať Studio OS' live-index.html
          grep -Fq 'Spoznať Bridge OS' live-index.html
          ! grep -Fq 'Zistiť viac' live-index.html
          ! grep -Fq 'Svet príbehov, postáv a miest zakorenený v jednej živej logike.' live-index.html
          ! grep -Fq '/brand/icon-svet-outline-24.svg' live-index.html
          ! grep -Fq '/brand/nuku-symbol-master-v1.1.svg' live-index.html
          ! grep -Fq '/brand/icon-studio-outline-24.svg' live-index.html
          ! grep -Fq '/brand/bridge-os-symbol-master-v1.0.svg' live-index.html
          curl --fail --silent "$PREVIEW_URL"'brand/cloverwood-world-family-symbol.svg' >/dev/null
          curl --fail --silent "$PREVIEW_URL"'brand/nuku-world-family-symbol.svg' >/dev/null
          curl --fail --silent "$PREVIEW_URL"'brand/studio-os-family-symbol.svg' >/dev/null
          curl --fail --silent "$PREVIEW_URL"'brand/bridge-os-family-symbol.svg' >/dev/null
          curl --fail --silent "$PREVIEW_URL"'kontakt/' -o live-contact.html
          grep -Fq 'mailto:cloverwoodstudio@gmail.com' live-contact.html

      - name: Capture live desktop tablet mobile
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser"
          mkdir screenshots
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=screenshots/preview-desktop-1440.png "$PREVIEW_URL"
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1024,1366 --screenshot=screenshots/preview-tablet-1024.png "$PREVIEW_URL"
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=screenshots/preview-mobile-390.png "$PREVIEW_URL"

      - name: Upload live preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cloverwood-current-main-live-preview-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7
