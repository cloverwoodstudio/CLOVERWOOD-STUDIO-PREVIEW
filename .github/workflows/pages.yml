name: Deploy Temporary Website Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out preview repository
        uses: actions/checkout@v6

      - name: Capture live baseline and apply locked icons
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deployment-site
          mkdir deployment-site

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from html.parser import HTMLParser
          from pathlib import Path, PurePosixPath
          from urllib.parse import unquote, urljoin, urlsplit, urlunsplit
          from urllib.request import Request, urlopen

          BASE_URL = 'https://cloverwoodstudio.github.io/CLOVERWOOD-STUDIO-PREVIEW/'
          BASE = urlsplit(BASE_URL)
          BASE_PATH = BASE.path
          SITE_ROOT = Path('deployment-site')

          REQUIRED_PATHS = [
              '404.html',
              '_astro/SiteLayout.BEvXq4m0.css',
              '_astro/montserrat-cyrillic-ext-wght-normal.CO5hGrJv.woff2',
              '_astro/montserrat-cyrillic-wght-normal.EAA9jha_.woff2',
              '_astro/montserrat-latin-ext-wght-normal.BsZE-iaG.woff2',
              '_astro/montserrat-latin-wght-normal.l_AIctKy.woff2',
              '_astro/montserrat-vietnamese-wght-normal.k7S-YeeD.woff2',
              '_astro/source-sans-3-cyrillic-ext-wght-normal.DzyfIafT.woff2',
              '_astro/source-sans-3-cyrillic-wght-normal.BMDVbyM7.woff2',
              '_astro/source-sans-3-greek-ext-wght-normal.BWSLJLk6.woff2',
              '_astro/source-sans-3-greek-wght-normal.C9H9m1vD.woff2',
              '_astro/source-sans-3-latin-ext-wght-normal.C8iNium2.woff2',
              '_astro/source-sans-3-latin-wght-normal.BqRLTx4X.woff2',
              '_astro/source-sans-3-vietnamese-wght-normal.C1uRvKPU.woff2',
              'artwork/cloverwood-home-hero-v0.3.webp',
              'brand/bridge-os-symbol-master-v1.0.svg',
              'brand/cloverwood-studio-symbol-web-v0.2.svg',
              'brand/icon-harmonia-outline-24.svg',
              'brand/icon-prepojenie-outline-24.svg',
              'brand/icon-priroda-outline-24.svg',
              'brand/icon-studio-outline-24.svg',
              'brand/icon-svet-outline-24.svg',
              'brand/icon-system-outline-24.svg',
              'brand/nuku-symbol-master-v1.1.svg',
              'bridge-os/index.html',
              'cloverwood/index.html',
              'index.html',
              'kontakt/index.html',
              'nuku/index.html',
              'o-studiu/index.html',
              'robots.txt',
              'sitemap.xml',
              'studio-os/index.html',
          ]

          REPLACEMENTS = {
              'brand/cloverwood-studio-symbol-web-v0.2.svg': (
                  Path('site/assets/logo-family/family-v1.2.1/cloverwood-studio-small.svg'),
                  '17d31d2e03aa42eee7df07a47b7c06a35aa8262921fd0daf8223b28a5b0594c7',
              ),
              'brand/nuku-symbol-master-v1.1.svg': (
                  Path('site/assets/logo-family/family-v1.2.1/nuku-small.svg'),
                  'e4162d4b537726f0366ebd33f6e5473056fc1098344ad418414de2931758a608',
              ),
              'brand/bridge-os-symbol-master-v1.0.svg': (
                  Path('site/assets/logo-family/family-v1.2.1/bridge-os-small.svg'),
                  'bd7b469bf6017c42202f556f8e095b954fde4ec4bdbe8f7d316611ece3912ccd',
              ),
          }

          class ReferenceParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.references: list[str] = []

              def handle_starttag(
                  self,
                  tag: str,
                  attrs: list[tuple[str, str | None]],
              ) -> None:
                  values = dict(attrs)
                  for name in ('src', 'href', 'poster'):
                      value = values.get(name)
                      if value:
                          self.references.append(value)
                  srcset = values.get('srcset')
                  if srcset:
                      for candidate in srcset.split(','):
                          value = candidate.strip().split(' ', 1)[0]
                          if value:
                              self.references.append(value)

          def clean_url(url: str) -> str:
              parts = urlsplit(url)
              return urlunsplit((parts.scheme, parts.netloc, parts.path, '', ''))

          def destination_for(url: str) -> Path | None:
              parts = urlsplit(clean_url(url))
              if (parts.scheme, parts.netloc) != (BASE.scheme, BASE.netloc):
                  return None

              path = parts.path
              if path == BASE_PATH.rstrip('/'):
                  relative = 'index.html'
              elif path.startswith(BASE_PATH):
                  relative = path[len(BASE_PATH):]
                  if not relative or relative.endswith('/'):
                      relative += 'index.html'
              else:
                  return None

              pure = PurePosixPath(unquote(relative))
              if pure.is_absolute() or '..' in pure.parts:
                  raise RuntimeError(f'Unsafe local path derived from URL: {url}')
              return SITE_ROOT.joinpath(*pure.parts)

          def references_from(path: Path, source_url: str) -> list[str]:
              suffix = path.suffix.lower()
              data = path.read_bytes()
              refs: list[str] = []

              if suffix == '.html':
                  parser = ReferenceParser()
                  parser.feed(data.decode('utf-8', errors='strict'))
                  refs.extend(parser.references)
              elif suffix == '.css':
                  text = data.decode('utf-8', errors='strict')
                  refs.extend(
                      match.group(2).strip()
                      for match in re.finditer(
                          r'url\(\s*(["\']?)(.*?)\1\s*\)',
                          text,
                          flags=re.IGNORECASE,
                      )
                  )
                  refs.extend(
                      match.group(2).strip()
                      for match in re.finditer(
                          r'@import\s+(["\'])(.*?)\1',
                          text,
                          flags=re.IGNORECASE,
                      )
                  )

              resolved: list[str] = []
              for ref in refs:
                  if not ref or ref.startswith(
                      ('#', 'data:', 'mailto:', 'tel:', 'javascript:')
                  ):
                      continue
                  absolute = clean_url(urljoin(source_url, ref))
                  if destination_for(absolute) is not None:
                      resolved.append(absolute)
              return resolved

          before: dict[str, str] = {}
          source_urls: dict[str, str] = {}

          for relative in REQUIRED_PATHS:
              source_url = clean_url(urljoin(BASE_URL, relative))
              destination = SITE_ROOT / relative
              request = Request(
                  source_url,
                  headers={
                      'User-Agent': 'Cloverwood-locked-icon-deployment/1.0',
                      'Accept-Encoding': 'identity',
                  },
                  method='GET',
              )
              with urlopen(request, timeout=30) as response:
                  status = response.status
                  body = response.read()

              if status != 200:
                  raise RuntimeError(
                      f'HTTP {status} for required live file: {source_url}'
                  )

              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(body)
              before[relative] = hashlib.sha256(body).hexdigest()
              source_urls[relative] = source_url

          captured = sorted(
              path.relative_to(SITE_ROOT).as_posix()
              for path in SITE_ROOT.rglob('*')
              if path.is_file()
          )
          if captured != sorted(REQUIRED_PATHS):
              raise RuntimeError(
                  f'Captured inventory differs from locked 33-file baseline: {captured}'
              )

          index_text = (SITE_ROOT / 'index.html').read_text(encoding='utf-8')
          if not re.search(
              r'noindex\s*,\s*nofollow',
              index_text,
              flags=re.IGNORECASE,
          ):
              raise RuntimeError(
                  'index.html does not contain noindex, nofollow.'
              )

          unresolved: list[tuple[str, str]] = []
          for relative in REQUIRED_PATHS:
              path = SITE_ROOT / relative
              if path.suffix.lower() not in {'.html', '.css'}:
                  continue
              for reference_url in references_from(
                  path,
                  source_urls[relative],
              ):
                  destination = destination_for(reference_url)
                  if destination is not None and not destination.is_file():
                      unresolved.append((relative, reference_url))

          if unresolved:
              raise RuntimeError(
                  f'Unresolved same-origin HTML/CSS references: {unresolved}'
              )

          for destination, (source, expected_sha) in REPLACEMENTS.items():
              source_body = source.read_bytes()
              source_sha = hashlib.sha256(source_body).hexdigest()
              if source_sha != expected_sha:
                  raise RuntimeError(
                      f'Locked source SHA mismatch for {source}: '
                      f'{source_sha} != {expected_sha}'
                  )
              (SITE_ROOT / destination).write_bytes(source_body)

          after = {
              relative: hashlib.sha256(
                  (SITE_ROOT / relative).read_bytes()
              ).hexdigest()
              for relative in REQUIRED_PATHS
          }
          changed = sorted(
              relative
              for relative in REQUIRED_PATHS
              if before[relative] != after[relative]
          )
          expected_changed = sorted(REPLACEMENTS)

          if changed == expected_changed:
              deployment_state = 'STATE A - first replacement'
          elif not changed:
              unlocked_live = sorted(
                  destination
                  for destination, (_, expected_sha) in REPLACEMENTS.items()
                  if before[destination] != expected_sha
              )
              if unlocked_live:
                  raise RuntimeError(
                      'Zero files changed after replacement, but live SVG '
                      f'SHA values were not already locked: {unlocked_live}'
                  )
              deployment_state = 'STATE B - already deployed and stable'
          else:
              raise RuntimeError(
                  'Expected either zero changes for an already locked '
                  'deployment or exactly the three authorized icon changes '
                  f'{expected_changed}; got {changed}'
              )

          for destination, (_, expected_sha) in REPLACEMENTS.items():
              if after[destination] != expected_sha:
                  raise RuntimeError(
                      f'Final SHA mismatch for {destination}: '
                      f'{after[destination]} != {expected_sha}'
                  )

          print(f'Captured files: {len(REQUIRED_PATHS)}')
          print(f'Deployment state: {deployment_state}')
          print('Changed files:')
          if changed:
              for relative in changed:
                  print(
                      f'- {relative}: '
                      f'{before[relative]} -> {after[relative]}'
                  )
          else:
              print('- none; all three live SVG files were already locked')
          print('All other captured files remained byte-identical.')
          print('noindex, nofollow: PASS')
          print('Same-origin HTML/CSS references: PASS')
          PY

      - name: Cache-bust locked icon references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from html.parser import HTMLParser
          from pathlib import Path, PurePosixPath
          from urllib.parse import unquote, urljoin, urlsplit, urlunsplit

          BASE_URL = 'https://cloverwoodstudio.github.io/CLOVERWOOD-STUDIO-PREVIEW/'
          BASE = urlsplit(BASE_URL)
          BASE_PATH = BASE.path
          SITE_ROOT = Path('deployment-site')
          VERSION = 'logo-family-1.2.1'
          ICON_FILENAMES = (
              'cloverwood-studio-symbol-web-v0.2.svg',
              'nuku-symbol-master-v1.1.svg',
              'bridge-os-symbol-master-v1.0.svg',
          )
          pattern = re.compile(
              r'(?P<name>'
              + '|'.join(re.escape(name) for name in ICON_FILENAMES)
              + r')(?:\?v=[A-Za-z0-9._-]+)?'
          )
          counts = {name: 0 for name in ICON_FILENAMES}
          changed_files: list[str] = []

          for path in sorted(SITE_ROOT.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.css'}:
                  continue
              original = path.read_text(encoding='utf-8')

              def replace(match: re.Match[str]) -> str:
                  name = match.group('name')
                  counts[name] += 1
                  return f'{name}?v={VERSION}'

              rewritten = pattern.sub(replace, original)
              if rewritten != original:
                  path.write_text(rewritten, encoding='utf-8')
                  changed_files.append(path.relative_to(SITE_ROOT).as_posix())

          missing = sorted(name for name, count in counts.items() if count == 0)
          if missing:
              raise RuntimeError(
                  f'No HTML/CSS references found for locked icons: {missing}'
              )

          class ReferenceParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.references: list[str] = []

              def handle_starttag(
                  self,
                  tag: str,
                  attrs: list[tuple[str, str | None]],
              ) -> None:
                  values = dict(attrs)
                  for name in ('src', 'href', 'poster'):
                      value = values.get(name)
                      if value:
                          self.references.append(value)
                  srcset = values.get('srcset')
                  if srcset:
                      for candidate in srcset.split(','):
                          value = candidate.strip().split(' ', 1)[0]
                          if value:
                              self.references.append(value)

          def clean_url(url: str) -> str:
              parts = urlsplit(url)
              return urlunsplit((parts.scheme, parts.netloc, parts.path, '', ''))

          def destination_for(url: str) -> Path | None:
              parts = urlsplit(clean_url(url))
              if (parts.scheme, parts.netloc) != (BASE.scheme, BASE.netloc):
                  return None
              path = parts.path
              if path == BASE_PATH.rstrip('/'):
                  relative = 'index.html'
              elif path.startswith(BASE_PATH):
                  relative = path[len(BASE_PATH):]
                  if not relative or relative.endswith('/'):
                      relative += 'index.html'
              else:
                  return None
              pure = PurePosixPath(unquote(relative))
              if pure.is_absolute() or '..' in pure.parts:
                  raise RuntimeError(f'Unsafe local path derived from URL: {url}')
              return SITE_ROOT.joinpath(*pure.parts)

          def references_from(path: Path, source_url: str) -> list[str]:
              text = path.read_text(encoding='utf-8')
              refs: list[str] = []
              if path.suffix.lower() == '.html':
                  parser = ReferenceParser()
                  parser.feed(text)
                  refs.extend(parser.references)
              else:
                  refs.extend(
                      match.group(2).strip()
                      for match in re.finditer(
                          r'url\(\s*(["\']?)(.*?)\1\s*\)',
                          text,
                          flags=re.IGNORECASE,
                      )
                  )
                  refs.extend(
                      match.group(2).strip()
                      for match in re.finditer(
                          r'@import\s+(["\'])(.*?)\1',
                          text,
                          flags=re.IGNORECASE,
                      )
                  )
              return [
                  urljoin(source_url, ref)
                  for ref in refs
                  if ref and not ref.startswith(
                      ('#', 'data:', 'mailto:', 'tel:', 'javascript:')
                  )
              ]

          unresolved: list[tuple[str, str]] = []
          for path in sorted(SITE_ROOT.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.css'}:
                  continue
              relative = path.relative_to(SITE_ROOT).as_posix()
              source_url = urljoin(BASE_URL, relative)
              for reference_url in references_from(path, source_url):
                  destination = destination_for(reference_url)
                  if destination is not None and not destination.is_file():
                      unresolved.append((relative, reference_url))

          if unresolved:
              raise RuntimeError(
                  f'Unresolved references after cache busting: {unresolved}'
              )

          print('Cache-busted locked icon references:')
          for name in ICON_FILENAMES:
              print(f'- {name}: {counts[name]} reference(s)')
          print('Changed HTML/CSS files:')
          if changed_files:
              for relative in changed_files:
                  print(f'- {relative}')
          else:
              print('- none; references were already versioned')
          print('Post-cache-bust same-origin references: PASS')
          PY

      - name: Validate public preview boundary
        run: |
          test -f deployment-site/index.html
          grep -q 'noindex, nofollow' deployment-site/index.html
          if grep -R -i -E 'company os|api[_ -]?key|secret|password' deployment-site --include='*.html' --include='*.css' --include='*.xml' --include='*.txt'; then
            echo 'Forbidden internal content found in public preview.'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: deployment-site

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [validate, deploy]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Record deployment result
        uses: actions/github-script@v8
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              body: `PREVIEW_DEPLOYMENT_RESULT\nvalidate=${process.env.VALIDATE_RESULT}\ndeploy=${process.env.DEPLOY_RESULT}\nurl=${process.env.PAGE_URL || ''}`
            })
