name: Verify Current Cloverwood Website Preview

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: preview-live-verification
  cancel-in-progress: true

env:
  SOURCE_SHA: 0ee5ec51cc4c8da7aa16288a75308bdf6c067666
  PREVIEW_URL: https://cloverwoodstudio.github.io/CLOVERWOOD-STUDIO-PREVIEW/

jobs:
  verify-live:
    if: contains(github.event.head_commit.message, '[preview-verify]')
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for authorized current preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --location "$PREVIEW_URL" -o live-index.html && \
               grep -Fq 'Autorský svet s vlastným kánonom, postavami a pravidlami kontinuity.' live-index.html && \
               grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/cloverwood-world-family-symbol.svg' live-index.html && \
               grep -Fq '>NUKU<' live-index.html; then
              echo 'Current authorized preview is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Authorized current preview did not become live within 5 minutes.'
          exit 1

      - name: Verify live content boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'noindex, nofollow' live-index.html
          grep -Fq 'My ho objavujeme.' live-index.html
          grep -Fq 'Objaviť NUKU' live-index.html
          grep -Fq 'Spoznať Studio OS' live-index.html
          grep -Fq 'Spoznať Bridge OS' live-index.html
          grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/cloverwood-world-family-symbol.svg' live-index.html
          grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/nuku-world-family-symbol.svg' live-index.html
          grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/studio-os-family-symbol.svg' live-index.html
          grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/bridge-os-family-symbol.svg' live-index.html

          ! grep -Fq 'Svet príbehov, postáv a miest zakorenený v jednej živej logike.' live-index.html
          ! grep -Fq 'Zistiť viac' live-index.html
          ! grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/icon-svet-outline-24.svg' live-index.html
          ! grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/nuku-symbol-master-v1.1.svg' live-index.html
          ! grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/icon-studio-outline-24.svg' live-index.html
          ! grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/brand/bridge-os-symbol-master-v1.0.svg' live-index.html
          ! grep -Fqi 'Company OS' live-index.html
          ! grep -Fqi 'hreflang' live-index.html
          ! grep -Fq '/CLOVERWOOD-STUDIO-PREVIEW/CLOVERWOOD-STUDIO-PREVIEW/' live-index.html

          curl --fail --silent "$PREVIEW_URL"'brand/cloverwood-world-family-symbol.svg' >/dev/null
          curl --fail --silent "$PREVIEW_URL"'brand/nuku-world-family-symbol.svg' >/dev/null
          curl --fail --silent "$PREVIEW_URL"'brand/studio-os-family-symbol.svg' >/dev/null
          curl --fail --silent "$PREVIEW_URL"'brand/bridge-os-family-symbol.svg' >/dev/null
          curl --fail --silent "$PREVIEW_URL"'kontakt/' -o live-contact.html
          grep -Fq 'mailto:cloverwoodstudio@gmail.com' live-contact.html

      - name: Capture live desktop tablet mobile
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser"
          mkdir screenshots
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=screenshots/preview-desktop-1440.png "$PREVIEW_URL"
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1024,1366 --screenshot=screenshots/preview-tablet-1024.png "$PREVIEW_URL"
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=screenshots/preview-mobile-390.png "$PREVIEW_URL"

      - name: Upload live preview screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloverwood-current-main-live-preview-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Publish verifiable commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='Current main preview live verification passed'
          else
            state=failure
            description='Current main preview live verification failed'
          fi
          export state description
          python3 - <<'PY' > status.json
          import json, os
          print(json.dumps({
            'state': os.environ['state'],
            'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            'description': os.environ['description'],
            'context': 'Cloverwood Preview Live'
          }))
          PY
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d @status.json >/dev/null
