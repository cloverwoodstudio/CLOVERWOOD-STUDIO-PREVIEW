name: Deploy Temporary Website Preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out preview repository
        uses: actions/checkout@v6

      - name: Download generated static website
        env:
          PREVIEW_ARTIFACT_URL_B64: 
        run: |
          artifact_url="$(printf '%s' "$PREVIEW_ARTIFACT_URL_B64" | base64 --decode)"
          curl --fail --location --retry 3 "$artifact_url" --output preview.zip
          rm -rf site
          mkdir site
          unzip -q preview.zip -d site

      - name: Validate public preview boundary
        run: |
          test -f site/index.html
          grep -q 'noindex, nofollow' site/index.html
          if grep -R -i -E 'company os|api[_ -]?key|secret|password' site --include='*.html' --include='*.css' --include='*.xml' --include='*.txt'; then
            echo 'Forbidden internal content found in public preview.'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [validate, deploy]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Record deployment result
        uses: actions/github-script@v8
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              body: `PREVIEW_DEPLOYMENT_RESULT\nvalidate=${process.env.VALIDATE_RESULT}\ndeploy=${process.env.DEPLOY_RESULT}\nurl=${process.env.PAGE_URL || ''}`
            })
