name: Deploy Temporary Website Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out preview repository
        uses: actions/checkout@v6

      - name: Download generated static website
        env:
          PREVIEW_ARTIFACT_URL_B64: 
        run: |
          artifact_url="$(printf '%s' "$PREVIEW_ARTIFACT_URL_B64" | base64 --decode)"
          curl --fail --location --retry 3 "$artifact_url" --output preview.zip
          rm -rf site
          mkdir site
          unzip -q preview.zip -d site

      - name: Validate public preview boundary
        run: |
          test -f site/index.html
          grep -q 'noindex, nofollow' site/index.html
          if grep -R -i -E 'company os|api[_ -]?key|secret|password' site --include='*.html' --include='*.css' --include='*.xml' --include='*.txt'; then
            echo 'Forbidden internal content found in public preview.'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
